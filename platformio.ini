; PlatformIO: compila e grava o firmware pelo VS Code.
; Quem preferir o Arduino IDE pode abrir firmware/balloone/balloone.ino direto.

[platformio]
src_dir = firmware/balloone

[env:freenove]
; Arduino core 3.3.12, a versão para a qual o código foi escrito
platform = espressif32@8.0.0
board = freenove_esp32_wrover
framework = arduino
; mais espaço para o programa (câmera + Wi-Fi)
board_build.partitions = huge_app.csv
monitor_speed = 115200
lib_deps = links2004/WebSockets@2.7.3
